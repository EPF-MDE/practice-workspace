<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">
  <title>One number decides the design: how many requests arrive, how long each takes, and the promise made to every person</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="720" height="250" fill="#f8fafc"/>
  <g fill="#ffffff" stroke="#334155" stroke-width="2">
    <rect x="30" y="80" width="160" height="70" rx="10"/>
    <rect x="280" y="80" width="160" height="70" rx="10"/>
    <rect x="530" y="80" width="160" height="70" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="110" y="112" font-weight="600">People</text>
    <text x="110" y="132">who ask</text>
    <text x="360" y="112" font-weight="600">The service</text>
    <text x="360" y="132">that answers</text>
    <text x="610" y="112" font-weight="600">What it asks</text>
    <text x="610" y="132">before answering</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M190 100 H278"/>
    <path d="M440 100 H528"/>
    <path d="M528 130 H442"/>
    <path d="M278 130 H192"/>
  </g>
  <g text-anchor="middle" fill="#1d4ed8" font-weight="600">
    <text x="235" y="60">how many,</text>
    <text x="235" y="78">how fast</text>
    <text x="485" y="60">how long</text>
    <text x="485" y="78">each takes</text>
    <text x="235" y="175">the promise:</text>
    <text x="235" y="193">answered within…</text>
  </g>
  <text x="360" y="232" text-anchor="middle" fill="#475569" font-size="13">Demo course: an invented drawing, the Demo course's own.</text>
</svg>
