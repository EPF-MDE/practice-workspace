# Every subpackage of `app` is a Deep Module, reached from outside only through
# names not starting with "_". Adding a module requires no edit here.
# import-linter rejects import cycles between modules, read from the real
# imports: see [tool.importlinter] in pyproject.toml.

source_roots = ["."]

# tach's default exclude list contains "**/tests"; restated without it, so the
# tests reach modules through their public surface like any other consumer.
exclude = ["**/*__pycache__", "**/*egg-info", "**/docs", "**/venv", "**/.venv", "static"]

forbid_circular_dependencies = true
root_module = "allow"

[[modules]]
path = "app.*"

[[modules]]
path = "<root>"

[[interfaces]]
expose = ["[^_][^.]*(\\.[^_][^.]*)*"]
