[project]
name = "practice-workspace"
version = "0.0.0"
description = "The Practice workspace's back end"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9",
    "tach~=0.35.0",
    "ruff>=0.15",
    "mypy>=1.19",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["app", "tests", "scripts"]
python_version = "3.13"
strict = true
