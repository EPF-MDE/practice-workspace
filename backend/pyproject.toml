[project]
name = "practice-workspace"
version = "0.0.0"
description = "The Practice workspace's back end"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9",
    "tach~=0.35.0",
    "ruff>=0.15",
    "mypy>=1.19",
    "import-linter~=2.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["app", "tests"]
python_version = "3.13"
strict = true

# Rejects import cycles between the modules of `app`, read from the real
# imports. Tach's `forbid_circular_dependencies` only sees the dependencies
# declared in tach.toml, and tach.toml declares none. depth = 0 checks only
# the modules themselves: inside a module, its files import each other freely.
[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
id = "no-cycles"
name = "No import cycles between the modules of app"
type = "acyclic_siblings"
ancestors = ["app"]
depth = 0
