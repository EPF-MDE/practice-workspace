[project]
name = "practice-workspace"
version = "0.0.0"
description = "The Practice workspace's back end"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "httpx>=0.28",
    "pydantic-settings>=2.11",
    "itsdangerous>=2.2",
    "pyjwt[crypto]>=2.10",
    "posthog>=7.0",
    "opentelemetry-sdk>=1.38",
    "opentelemetry-exporter-otlp-proto-http>=1.38",
    "markdown-it-py>=4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "tach~=0.35.0",
    "ruff>=0.15",
    "mypy>=1.19",
    "import-linter~=2.17",
    "types-pyyaml",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependencies are declared as default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Cookie"]

[tool.mypy]
files = ["app", "tests"]
python_version = "3.13"
strict = true
# Knows pydantic-settings' init arguments, such as `_env_file`.
plugins = ["pydantic.mypy"]

# Rejects import cycles between the modules of `app`, read from the real
# imports. Tach's `forbid_circular_dependencies` only sees the dependencies
# declared in tach.toml, and tach.toml declares none. depth = 0 checks only
# the modules themselves: inside a module, its files import each other freely.
[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
id = "no-cycles"
name = "No import cycles between the modules of app"
type = "acyclic_siblings"
ancestors = ["app"]
depth = 0
