# Writes the caches the agent workflows read: npm's, uv's and agent-browser's
# Chrome, on `main`, under the keys those workflows look up. Why this
# workflow and not the agents' own runs is ADR-0019.
#
# Every key here must stay the one the agent workflows and check.yml's
# frontend job use:
#   npm   setup-node, Node 24, cache-dependency-path on both lock files
#   uv    setup-uv, cache-dependency-glob backend/uv.lock
#   Chrome  agent-browser-<version>-<os>
# A key that drifts would be written here and read by nobody, so
# scripts/check-cache-keys.js refuses it.
name: Warm the caches

on:
  # A lock file changed on main: the agents' next keys are new.
  push:
    branches: [main]
    paths:
      - package-lock.json
      - frontend/package-lock.json
      - backend/uv.lock
      - .github/workflows/warm-caches.yml
  # GitHub evicts a cache nobody read for seven days. Twice a week reads, or
  # writes, each one, so a quiet week does not leave the agents cold.
  schedule:
    - cron: "30 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-caches
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the dependencies into the caches
        # The global packages too, which every agent job installs: npm's cache
        # keeps them even when Chrome's cache needs no install.
        run: |
          npm ci --no-audit --no-fund
          npm --prefix frontend ci --no-audit --no-fund
          npm install -g agent-browser@0.27.0 @anthropic-ai/claude-code
          (cd backend && uv sync)

      - name: Cache agent-browser's Chrome
        id: chrome
        uses: actions/cache@v6.1.0
        with:
          path: ~/.agent-browser/browsers
          key: agent-browser-0.27.0-${{ runner.os }}

      - name: Install agent-browser's Chrome
        if: steps.chrome.outputs.cache-hit != 'true'
        run: agent-browser install
